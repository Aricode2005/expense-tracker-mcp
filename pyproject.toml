[project]
name = "epense-tracker-mcp"
version = "0.1.0"
description = "A production-grade MCP server for personal expense tracking with SQLite, budgets, trends, and CSV export — built for Claude Desktop."
readme = "README.md"
authors = [
    { name = "Aricode2005", email = "aritraduttauttarpara@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
]

[project.scripts]
epense-tracker-mcp = "epense_tracker_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
